<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Analizörü Ayarları</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { margin-top: 0; color: #333; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #555; }
        input[type="password"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .status { margin-top: 15px; font-size: 14px; text-align: center; }
        .kural-notu { font-size: 12px; color: #777; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚙️ Eklenti Ayarları</h2>
        
        <label for="apiKey">LLM API Anahtarı:</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
        
        <button id="kaydetBtn">Anahtarı Kaydet</button>
        
        <div id="status" class="status"></div>

        <div class="kural-notu">
            * Güvenlik Kuralı: Girdiğiniz API anahtarı kaynak koduna yazılmaz, sadece tarayıcınızın güvenli yerel hafızasında saklanır.
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
